[package]
name = "kwi"
version = "0.1.0"
edition = "2024"

[dev-dependencies]
actix-web = { version = "4.15.0", features = ["macros"] }

[dependencies]
actix-web = "4"
envy = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0.20"
diesel = { version = "2.3.12", features = [
    "postgres",
    "uuid",
    "r2d2",
    "chrono",
    "network-address",
] }
diesel-async = { version = "0.9.2", features = ["postgres", "pool", "bb8"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
uuid = { version = "1.26.0", features = ["serde", "v4"] }
diesel-derive-enum = { version = "2.1.0", features = ["postgres"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde_qs = { version = "1.1.3", features = ["actix4"] }
